services:
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26}
    container_name: memorable-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memorable}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - memorable-neo4j-data:/data
    restart: unless-stopped

volumes:
  memorable-neo4j-data:
