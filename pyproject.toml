[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorable"
version = "0.1.0"
description = "Project-scoped GraphRAG memory for agents."
readme = "docs/product.md"
requires-python = ">=3.9"
dependencies = [
    "neo4j>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
memorable = "memorable.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
