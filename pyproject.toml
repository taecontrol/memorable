[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorable"
version = "0.0.1"
description = "Project-scoped GraphRAG memory for agents."
readme = "docs/product.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.6",
    "mcp>=1.27,<2",
    "neo4j>=5.0",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/taecontrol/memorable"
Repository = "https://github.com/taecontrol/memorable"
Issues = "https://github.com/taecontrol/memorable/issues"

[project.optional-dependencies]
dev = [
    "anyio>=4.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
memorable = "memorable.cli:main"
memorable-mcp = "memorable.mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires external services (Neo4j, etc.)",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
