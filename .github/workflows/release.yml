name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        run: uv python install 3.14

      - name: Assert tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >-
          uv run --extra dev python scripts/assert_release_version.py
          --tag "${{ github.ref_name }}"
          --pyproject pyproject.toml

      - name: Export release version
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

  pre_publish:
    name: Pre-publish acceptance gate
    runs-on: ubuntu-latest
    needs: build
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/memorable
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p memorable 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        run: uv python install 3.14

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Install built wheel in clean environment
        run: |
          uv venv --python 3.14
          uv pip install dist/*.whl

      - name: Run V1 acceptance flow against built wheel
        env:
          MEMORABLE_NEO4J_URI: bolt://localhost:7687
          MEMORABLE_NEO4J_USER: neo4j
          MEMORABLE_NEO4J_PASSWORD: memorable
        run: >-
          .venv/bin/python scripts/v1_acceptance.py
          --memorable-cmd "$PWD/.venv/bin/memorable"
          --mcp-cmd "$PWD/.venv/bin/memorable-mcp"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: pre_publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/memorable-kg
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  post_publish_smoke:
    name: Post-publish smoke
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/memorable
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p memorable 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        run: uv python install 3.14

      - name: Install script dependencies
        run: uv sync --extra dev

      - name: Run V1 acceptance flow against published package
        env:
          MEMORABLE_NEO4J_URI: bolt://localhost:7687
          MEMORABLE_NEO4J_USER: neo4j
          MEMORABLE_NEO4J_PASSWORD: memorable
        run: >-
          uv run --extra dev python scripts/v1_acceptance.py
          --memorable-cmd "uvx --from memorable-kg@${{ needs.build.outputs.version }} memorable"
          --mcp-cmd "uvx --from memorable-kg@${{ needs.build.outputs.version }} memorable-mcp"
